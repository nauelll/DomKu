<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="theme-color" content="#10B981">
  <meta name="description" content="DomKu — PWA catatan keuangan pribadi: pemasukan, pengeluaran, utang, piutang, tabungan, aset, anggaran, dan laporan keuangan lengkap. Offline-first, data tersimpan lokal di perangkat Anda.">
  <meta name="keywords" content="domku, dompetku, keuangan, pribadi, dompet, catatan, pengeluaran, pemasukan, utang, piutang, tabungan, anggaran, laporan, offline, pwa">
  <meta name="author" content="DomKu">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="DomKu — Catatan Keuangan Pribadi">
  <meta property="og:description" content="Aplikasi catatan keuangan pribadi offline. Lengkap: pemasukan, pengeluaran, utang, piutang, tabungan, aset, anggaran, laporan.">
  <meta property="og:image" content="assets/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon.png">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DomKu">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <title>DomKu — Catatan Keuangan Pribadi</title>

  <!-- Inline pre-loader to prevent flash before app loads -->
  <style>
    #preloader {
      position: fixed; inset: 0;
      background: var(--bg, #FAFBFC);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px; z-index: 9999;
      transition: opacity .35s ease;
    }
    #preloader.hidden { opacity: 0; pointer-events: none; }
    #preloader .logo-img {
      width: 88px; height: 88px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 16px 40px rgba(5, 150, 105, 0.25), 0 4px 12px rgba(15, 23, 42, 0.1);
      animation: pulse 1.4s ease-in-out infinite;
    }
    #preloader .name {
      font-family: system-ui; font-weight: 800; color: #0F172A; font-size: 26px; letter-spacing: -0.03em;
    }
    #preloader .name .blue { color: #3B82F6; }
    #preloader .name .green { color: #10B981; }
    #preloader .sub { font-family: system-ui; color: #94A3B8; font-size: 13px; font-weight: 500; }
    #preloader .spinner {
      width: 28px; height: 28px;
      border: 2px solid #E5E7EB;
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 4px;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Preloader -->
  <div id="preloader">
    <img class="logo-img" src="assets/images/logo-square.png" alt="DomKu">
    <div class="name"><span class="blue">Dom</span><span class="green">Ku</span></div>
    <div class="sub">Memuat...</div>
    <div class="spinner"></div>
  </div>

  <!-- Lock screen (only shown when PIN/password is set) -->
  <div id="lockScreen" class="lock-screen" style="display:none">
    <div class="lock-card">
      <img class="lock-logo-img" src="assets/images/logo-square.png" alt="DomKu">
      <h1><span style="color:#3B82F6">Dom</span><span style="color:#10B981">Ku</span></h1>
      <p>Masukkan PIN untuk melanjutkan</p>
      <form id="lockForm" autocomplete="off">
        <input type="password" id="lockInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••" aria-label="PIN">
        <button type="submit" class="btn btn-primary btn-block">Buka Kunci</button>
      </form>
      <p class="lock-hint">Lupa PIN? Reset di pengaturan browser (clear IndexedDB).</p>
    </div>
  </div>

  <!-- App root (filled by app.js) -->
  <div id="app"></div>

  <!-- ============ Scripts ============ -->
  <!-- Order matters: utils, db, settings, theme, auth first; then UI; then components; then pages; finally app.js -->

  <!-- Firebase config + modular SDK (ES module) -->
  <script src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/firebase.js"></script>

  <!-- Core -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/crypto.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/settings.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/auth-firebase.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/wallet.js"></script>
  <script src="assets/js/notify.js"></script>
  <script src="assets/js/migrate.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/export.js"></script>
  <script src="assets/js/import.js"></script>
  <script src="assets/js/backup.js"></script>
  <script src="assets/js/reminders.js"></script>

  <!-- Database -->
  <script src="assets/database/schema.js"></script>
  <script src="assets/database/seed.js"></script>

  <!-- Components -->
  <script src="assets/components/navbar.js"></script>
  <script src="assets/components/sidebar.js"></script>
  <script src="assets/components/forms.js"></script>
  <script src="assets/components/transaction-form.js"></script>
  <script src="assets/components/debt-form.js"></script>
  <script src="assets/components/saving-form.js"></script>
  <script src="assets/components/asset-form.js"></script>
  <script src="assets/components/budget-form.js"></script>

  <!-- Pages -->
  <script src="assets/pages/login.js"></script>
  <script src="assets/pages/dashboard.js"></script>
  <script src="assets/pages/transactions.js"></script>
  <script src="assets/pages/debts.js"></script>
  <script src="assets/pages/receivables.js"></script>
  <script src="assets/pages/savings.js"></script>
  <script src="assets/pages/assets.js"></script>
  <script src="assets/pages/budgets.js"></script>
  <script src="assets/pages/reports.js"></script>
  <script src="assets/pages/calendar.js"></script>
  <script src="assets/pages/search.js"></script>
  <script src="assets/pages/wallet.js"></script>
  <script src="assets/pages/notifications.js"></script>
  <script src="assets/pages/audit.js"></script>
  <script src="assets/pages/settings-page.js"></script>

  <!-- App entry -->
  <script src="assets/js/app.js"></script>

  <!-- Lock screen + preloader logic -->
  <script>
    (function () {
      const preloader = document.getElementById('preloader');
      const lockScreen = document.getElementById('lockScreen');
      const lockForm = document.getElementById('lockForm');
      const lockInput = document.getElementById('lockInput');

      // Hide preloader once app starts rendering
      function hidePreloader() {
        setTimeout(() => preloader.classList.add('hidden'), 400);
      }

      // Lock state change listener
      document.addEventListener('dompetku:lock-change', (e) => {
        const unlocked = e.detail.unlocked;
        const hasSecurity = document.documentElement.dataset.hasPin === 'true';
        if (hasSecurity && !unlocked) {
          lockScreen.style.display = 'flex';
          lockInput.value = '';
          setTimeout(() => lockInput.focus(), 100);
        } else {
          lockScreen.style.display = 'none';
        }
      });

      lockForm.onsubmit = async (e) => {
        e.preventDefault();
        const code = lockInput.value;
        if (!code) return;
        const ok = await Auth.unlock(code);
        if (!ok) {
          lockInput.value = '';
          lockInput.classList.add('shake');
          setTimeout(() => lockInput.classList.remove('shake'), 400);
          Toast.error('PIN salah');
        }
      };

      // After app.js loads, hide preloader and check lock state
      window.addEventListener('load', async () => {
        // Wait briefly for app.js async init to complete
        let tries = 0;
        const wait = setInterval(() => {
          tries++;
          if (window.Auth && window.Settings) {
            clearInterval(wait);
            hidePreloader();
            const hasSecurity = Auth.hasSecurity();
            document.documentElement.dataset.hasPin = String(hasSecurity);
            if (!hasSecurity) {
              // No PIN set — mark as unlocked
              Auth.skipSecurity();
            } else {
              // Show lock screen
              lockScreen.style.display = 'flex';
              setTimeout(() => lockInput.focus(), 300);
            }
          } else if (tries > 20) {
            clearInterval(wait);
            hidePreloader();
          }
        }, 100);
      });

      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((err) => console.log('SW reg failed:', err));
        });
      }
    })();
  </script>
</body>
</html>
